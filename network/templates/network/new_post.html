{% extends "network/layout.html" %}

{% block body %}
    {% if user.is_authenticated %}
        <a class="nav-link">New post from: <strong>{{ user.username }}</strong></a>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit</button>
        </form>
    {% endif %}
{% endblock %}
